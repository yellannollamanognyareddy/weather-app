<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            padding: 2%;
            margin: 2%;
            background-color:#e6ffe6;
        }
        button{
            background-color: rgb(45, 219, 45);
        }
        form{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .info{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        p{
            font-weight: 600;
        }
        .container{
            background-color: #ccffcc;
            border: 2px solid #99cc99; 
        }
        .item{
            padding: 20px;
            padding-left: 80px;
             padding-right: 80px;
            margin: 20px;
            border: 2px solid #99cc99; 
        }
    </style>
</head>
<body>
    <div class="container">
    <center><h1>Weather App</h1></center>
    <form action="/" method="POST">
        {% csrf_token %}
        <div><input type="text" name="name" placeholder="Enter City"></div>
        <div><button type="submit">Submit</button></div>
        <a href="{% url 'clearall' %}">Clear All</a>
    </form>
    <div class="info">
        <ul>
        {% for day in history %}
        <div class="item">
        <p>City:  {{day.city}}</p>
        <p>Humidity:  {{day.humidity}}</p>
        <p>Temparature:  {{day.temp}}'C</p>
        <p>Weather: {{day.description}}</p>
        <a href="{% url 'clear' day.id %}">clear</a>
        </div>
        {% endfor %}
        </ul>
    </div>
    </div>
</body>
</html>
